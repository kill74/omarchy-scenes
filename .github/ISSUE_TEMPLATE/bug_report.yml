name: Bug report
description: Report a problem with Scenes
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please do not include secrets or personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scenes version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: omarchy
    attributes:
      label: Omarchy / Hyprland version
      placeholder: "Omarchy Quattro, Hyprland 0.56.2"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `scenes status`, `scenes why` and relevant `journalctl --user -u scenesd.service` lines.
      render: shell
    validations:
      required: false
