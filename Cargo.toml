[workspace]
resolver = "2"
members = ["crates/scenes-core", "crates/scenesd", "crates/scenes"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/kill74/omarchy-scenes"

[workspace.dependencies]
scenes-core = { path = "crates/scenes-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
rusqlite = "0.43"
tokio = { version = "1", features = ["full"] }
